<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 링크 모음</title>
  <style>
    
{
    box-sizing: border-box;}

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e0e7ff, #fce7f3);
      color: #333;
      text-align: center;
    }

    .container {
      max-width: 430px;
      margin: 50px auto;
      padding: 35px 25px;
      background: white;
      border-radius: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .profile {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .intro {
      color: #888;
      margin-bottom: 30px;
    }

    .link {
      display: block;
      padding: 16px;
      margin: 13px 0;
      border-radius: 12px;
      background: #f3f4f6;
      color: #444;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }

    .link:hover {
      background: #dbeafe;
      transform: translateY(-3px);
    }

    footer {
      margin-top: 30px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="profile">🌷</div>

    <h1>나의 링크 모음</h1>
    <p class="intro">자주 사용하는 사이트를 한곳에 모았어요!</p>

    <a class="link" href="https://www.naver.com/" target="_blank">🔍 네이버</a>

    <a class="link" href="https://www.youtube.com/" target="_blank">▶ 유튜브</a>

    <a class="link" href="https://www.google.com/" target="_blank">🌐 구글</a>

    <a class="link" href="https://github.com/" target="_blank">💻 GitHub</a>

    <footer>My Link Page © 2026</footer>
  </div>

</body>
</html>
